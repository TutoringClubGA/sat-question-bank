name: Verify Tutoring Club SAT bank migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-sat-bank.yml]

permissions:
  actions: write

jobs:
  verify:
    if: github.repository == 'TutoringClubGA/sat-question-bank'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start a full database refresh and Pages deployment
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main --field refresh=true
